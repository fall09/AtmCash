$kind: http-request
url: "{{baseUrl}}/api/atms/{{atmId}}/reconciliations"
method: POST
headers:
  Content-Type: application/json
  X-User: technician1
body:
  type: json
  content: |-
    {
      "counts": [
        {
          "slot": 2,
          "countedCount": 50
        },
        {
          "slot": 3,
          "countedCount": 50
        },
        {
          "slot": 4,
          "countedCount": 47
        },
        {
          "slot": 5,
          "countedCount": 20
        }
      ],
      "depositCounts": [
        {
          "currency": "EUR",
          "denomination": 50,
          "countedCount": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const j = pm.response.json();
      pm.test('System had 51 x TRY100, counted 50 -> diff 100 TRY, COMPLETED', () => { pm.expect(j.status).to.eql('COMPLETED'); pm.expect(j.totalAbsoluteDifferenceTry).to.eql(100); });
    language: text/javascript
order: 13000
