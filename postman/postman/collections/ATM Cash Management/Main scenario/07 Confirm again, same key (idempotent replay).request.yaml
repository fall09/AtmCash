$kind: http-request
url: "{{baseUrl}}/api/quotes/{{quoteId}}/confirm"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idempotencyKey}}"
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Replay header set', () => pm.expect(pm.response.headers.get('Idempotent-Replayed')).to.eql('true'));
      pm.test('Same result', () => pm.expect(pm.response.json().dispensedAmount).to.eql(160));
    language: text/javascript
order: 8000
