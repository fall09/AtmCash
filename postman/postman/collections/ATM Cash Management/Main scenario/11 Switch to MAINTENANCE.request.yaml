$kind: http-request
url: "{{baseUrl}}/api/atms/{{atmId}}/transitions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "target": "MAINTENANCE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status MAINTENANCE', () => pm.expect(pm.response.json().status).to.eql('MAINTENANCE'));
    language: text/javascript
order: 12000
