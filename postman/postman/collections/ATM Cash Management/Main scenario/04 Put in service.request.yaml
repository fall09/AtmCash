$kind: http-request
url: "{{baseUrl}}/api/atms/{{atmId}}/transitions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "target": "IN_SERVICE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status IN_SERVICE', () => pm.expect(pm.response.json().status).to.eql('IN_SERVICE'));
    language: text/javascript
order: 5000
