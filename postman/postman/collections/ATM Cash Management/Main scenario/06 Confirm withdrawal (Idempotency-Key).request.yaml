$kind: http-request
url: "{{baseUrl}}/api/quotes/{{quoteId}}/confirm"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idempotencyKey}}"
body:
  type: json
  content: "{}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('idempotencyKey', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Dispensed 160', () => pm.expect(j.dispensedAmount).to.eql(160));
      pm.test('Not a replay', () => pm.expect(pm.response.headers.has('Idempotent-Replayed')).to.eql(false));
    language: text/javascript
order: 7000
