$kind: http-request
url: "{{baseUrl}}/api/atms/{{atmId}}/deposits"
method: POST
headers:
  Content-Type: application/json
  X-User: customer1
body:
  type: json
  content: |-
    {
      "notes": [
        {
          "currency": "TRY",
          "denomination": 100,
          "count": 2
        },
        {
          "currency": "EUR",
          "denomination": 50,
          "count": 1
        }
      ],
      "unrecognizedCount": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('TRY 100s go to recycling cassette slot 2', () => pm.expect(j.accepted.find(a => a.currency === 'TRY').cassetteSlot).to.eql(2));
      pm.test('EUR goes to deposit cassette (slot 1)', () => pm.expect(j.accepted.find(a => a.currency === 'EUR').cassetteSlot).to.eql(1));
      pm.test('Unrecognised notes returned', () => pm.expect(j.returned.some(r => r.reason === 'UNRECOGNISED' && r.count === 2)).to.eql(true));
    language: text/javascript
order: 11000
