$kind: http-request
url: "{{baseUrl}}/api/atms/{{atmId}}/cassettes"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cassettes": [
        {
          "slot": 2,
          "currency": "TRY",
          "denomination": 100
        },
        {
          "slot": 3,
          "currency": "TRY",
          "denomination": 50
        },
        {
          "slot": 4,
          "currency": "TRY",
          "denomination": 20
        },
        {
          "slot": 5,
          "currency": "USD",
          "denomination": 100
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status CONFIGURED', () => pm.expect(pm.response.json().status).to.eql('CONFIGURED'));
    language: text/javascript
order: 3000
