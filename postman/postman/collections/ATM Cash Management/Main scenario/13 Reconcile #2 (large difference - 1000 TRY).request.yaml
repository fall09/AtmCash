$kind: http-request
name: "13 Reconcile #2 (large difference > 1000 TRY)"
url: "{{baseUrl}}/api/atms/{{atmId}}/reconciliations"
method: POST
headers:
  Content-Type: application/json
  X-User: technician1
body:
  type: json
  content: |-
    {
      "counts": [
        {
          "slot": 2,
          "countedCount": 38
        },
        {
          "slot": 3,
          "countedCount": 50
        },
        {
          "slot": 4,
          "countedCount": 47
        },
        {
          "slot": 5,
          "countedCount": 20
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const j = pm.response.json();
      pm.collectionVariables.set('reconciliationId', j.id);
      pm.test('AWAITING_APPROVAL', () => pm.expect(j.status).to.eql('AWAITING_APPROVAL'));
    language: text/javascript
order: 14000
