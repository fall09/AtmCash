$kind: http-request
url: "{{baseUrl}}/api/quotes/{{quoteId}}/confirm"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{$guid}}"
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Error code', () => pm.expect(pm.response.json().code).to.eql('QUOTE_ALREADY_CONFIRMED'));
    language: text/javascript
order: 9000
