$kind: http-request
url: "{{baseUrl}}/api/quotes/{{altQuoteId}}/confirm"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{$guid}}"
body:
  type: json
  content: |-
    {
      "option": "UPPER"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Dispensed 40', () => pm.expect(pm.response.json().dispensedAmount).to.eql(40));
    language: text/javascript
order: 3000
